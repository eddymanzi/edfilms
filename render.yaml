services:
  # =========================
  # BACKEND
  # =========================
  - type: web
    name: edfilms-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js

    envVars:
      - key: NODE_ENV
        value: production

      # TEMPORARY for Render Free Web Service: no persistent disk support.
      # /tmp/storage is ephemeral — uploaded movie/poster files may disappear after restart/redeploy.
      # Switch back to a persistent disk path if you upgrade from the Free plan.
      - key: STORAGE_DIR
        value: /tmp/storage

      - key: DATABASE_URL
        fromDatabase:
          name: edfilms-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      # Admin account auto-created on first start (username is public info,
      # password is set in the Render dashboard, not here).
      - key: ADMIN_USERNAME
        value: admin

      - key: ADMIN_PASSWORD
        sync: false

      # Email for password-reset mail (forgot password). Set ADMIN_EMAIL to
      # the admin's mailbox and the MAIL_* vars to an SMTP account (e.g. Gmail
      # app password). Without MAIL_* the reset link request returns an error.
      - key: ADMIN_EMAIL
        sync: false

      - key: MAIL_HOST
        sync: false

      - key: MAIL_PORT
        sync: false

      - key: MAIL_USER
        sync: false

      - key: MAIL_PASS
        sync: false

      - key: MAIL_FROM
        sync: false

      # Frontend URL
      - key: FRONTEND_URL
        value: https://edfilms7.com

      - key: CORS_ORIGINS
        value: https://edfilms7.com,https://www.edfilms7.com,https://edfilms-frontend.onrender.com

      - key: SITE_URL
        value: https://edfilms7.com

      - key: PAYMENT_MODE
        value: mock

      - key: MOMO_API_BASE_URL
        sync: false

      - key: MOMO_API_KEY
        sync: false

      - key: MOMO_API_SECRET
        sync: false

      - key: MOMO_SUBSCRIPTION_KEY
        sync: false

      - key: MOMO_TARGET_ENVIRONMENT
        sync: false

      - key: MOMO_CALLBACK_URL
        sync: false

      - key: MOMO_RECEIVING_MSISDN
        sync: false


  # =========================
  # FRONTEND
  # =========================
  - type: web
    name: edfilms-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    # SPA fallback: serve index.html for client-side routes (/admin, /admin/login,
    # /movie/..., etc.) so they don't 404 on direct navigation or refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        value: https://edfilms-backend.onrender.com


# =========================
# DATABASE
# =========================
databases:
  - name: edfilms-db
    plan: free
    databaseName: edfilms
    user: edfilms