services:
  # =========================
  # BACKEND
  # =========================
  - type: web
    name: edfilms-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js

    envVars:
      - key: NODE_ENV
        value: production

      - key: STORAGE_DIR
        value: /data/storage

      - key: DATABASE_URL
        fromDatabase:
          name: edfilms-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      # Frontend URL
      - key: FRONTEND_URL
        value: https://edfilms-frontend.onrender.com

      - key: CORS_ORIGINS
        value: https://edfilms-frontend.onrender.com

      - key: SITE_URL
        value: https://edfilms-frontend.onrender.com

      - key: PAYMENT_MODE
        value: mock

      - key: MOMO_API_BASE_URL
        sync: false

      - key: MOMO_API_KEY
        sync: false

      - key: MOMO_API_SECRET
        sync: false

      - key: MOMO_SUBSCRIPTION_KEY
        sync: false

      - key: MOMO_TARGET_ENVIRONMENT
        sync: false

      - key: MOMO_CALLBACK_URL
        sync: false


  # =========================
  # FRONTEND
  # =========================
  - type: web
    name: edfilms-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        value: https://edfilms-backend.onrender.com


# =========================
# DATABASE
# =========================
databases:
  - name: edfilms-db
    plan: free
    databaseName: edfilms
    user: edfilms