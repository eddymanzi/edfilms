services:
  - type: web
    name: edfilms-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DIR
        value: /data/storage
      - key: DATABASE_URL
        fromDatabase:
          name: edfilms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: edfilms-frontend
          property: url
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: edfilms-frontend
          property: url
      - key: SITE_URL
        fromService:
          type: web
          name: edfilms-frontend
          property: url
      # Starts in mock mode (no MTN credentials needed). Flip to "live" and set
      # the MOMO_* vars once you have real credentials; "live" is enforced.
      - key: PAYMENT_MODE
        value: mock
      - key: MOMO_API_BASE_URL
        sync: false
      - key: MOMO_API_KEY
        sync: false
      - key: MOMO_API_SECRET
        sync: false
      - key: MOMO_SUBSCRIPTION_KEY
        sync: false
      - key: MOMO_TARGET_ENVIRONMENT
        sync: false
      - key: MOMO_CALLBACK_URL
        sync: false
    

  - type: web
    name: edfilms-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: edfilms-backend
          property: url

databases:
  - name: edfilms-db
    plan: free
    databaseName: edfilms
    user: edfilms